name: P1 One-shot Reconcile & Gate

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p1-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile-and-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: p1_gate
          POSTGRES_PASSWORD: p1_gate_password
          POSTGRES_DB: p1_gate_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://p1_gate:p1_gate_password@localhost:5432/p1_gate_db

    steps:
      - name: Checkout latest P1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Rebase latest branch before patch
        run: git pull --rebase origin feat/odoo-complete-suite

      - name: Reconcile frontend wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          selector_path = Path('frontend/src/pages/ModuleSelectorPage.tsx')
          selector = selector_path.read_text()
          supply_marker = "const P1_SUPPLY_IDS = new Set(["
          start = selector.find(supply_marker)
          end = selector.find(']);', start)
          if start < 0 or end < 0:
              raise SystemExit('P1_SUPPLY_IDS block not found')
          block = selector[start:end]
          block = block.replace("  'inventory',\n", '')
          selector = selector[:start] + block + selector[end:]
          selector_path.write_text(selector)

          page_path = Path('frontend/src/pages/SupplyChainWorkspacePage.tsx')
          page = page_path.read_text()
          old_import = "import ProcurementRfqPanel from '../components/supply-chain/ProcurementRfqPanel';"
          new_import = "import ProcurementRfqPanelV2 from '../components/supply-chain/ProcurementRfqPanelV2';"
          if old_import in page:
              page = page.replace(old_import, new_import, 1)
          elif new_import not in page:
              anchor = "} from '../services/supplyChainService';"
              if anchor not in page:
                  raise SystemExit('Supply-chain import anchor not found')
              page = page.replace(anchor, anchor + "\n" + new_import, 1)

          page = page.replace('<ProcurementRfqPanel />', '<ProcurementRfqPanelV2 />')
          p_start = page.find("{tab === 'procurement' &&")
          w_start = page.find("{tab === 'warehouse' &&")
          if p_start < 0 or w_start < 0 or w_start <= p_start:
              raise SystemExit('Procurement/Warehouse tab boundaries not found')
          segment = page[p_start:w_start]
          if '<ProcurementRfqPanelV2 />' not in segment:
              old_start = "{tab === 'procurement' && <section"
              if old_start not in segment:
                  raise SystemExit('Cannot safely wrap Procurement tab')
              segment = segment.replace(
                  old_start,
                  "{tab === 'procurement' && <div className=\"space-y-5\"><ProcurementRfqPanelV2 /><section",
                  1,
              )
              stripped = segment.rstrip()
              if not stripped.endswith('</section>}'):
                  raise SystemExit('Procurement section closing marker not found')
              stripped = stripped[:-len('</section>}')] + '</section></div>}'
              segment = stripped + segment[len(segment.rstrip()):]
              page = page[:p_start] + segment + page[w_start:]

          if page.count('<ProcurementRfqPanelV2 />') != 1:
              raise SystemExit(f'Expected exactly one RFQ V2 panel, found {page.count("<ProcurementRfqPanelV2 />")}')
          if '<ProcurementRfqPanel />' in page:
              raise SystemExit('Legacy RFQ panel tag still present')
          page_path.write_text(page)
          PY

      - name: Reconcile stock-count physical variance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/modules/fnb/controllers/warehouse.p1.controller.ts')
          text = path.read_text()

          old = """        const expected = Number(line.expected_quantity || 0);\n        const variance = counted - expected;\n\n        const balanceRows = await tx.$queryRaw<any[]>(Prisma.sql`\n          SELECT * FROM public.warehouse_stock_balances WHERE tenant_id = ${tenantId} AND location_id = ${count.location_id} AND inventory_id = ${inventoryId} FOR UPDATE\n        `);\n        const balanceBefore = Number(balanceRows[0]?.quantity || 0);"""
          new = """        const snapshotExpected = Number(line.expected_quantity || 0);\n\n        const balanceRows = await tx.$queryRaw<any[]>(Prisma.sql`\n          SELECT * FROM public.warehouse_stock_balances WHERE tenant_id = ${tenantId} AND location_id = ${count.location_id} AND inventory_id = ${inventoryId} FOR UPDATE\n        `);\n        const balanceBefore = Number(balanceRows[0]?.quantity || 0);\n        // Reconcile against the current locked system balance, not a stale opening snapshot.\n        const variance = counted - balanceBefore;\n        const movementDuringCount = balanceBefore - snapshotExpected;"""
          if old in text:
              text = text.replace(old, new, 1)

          old_note = "notes: `Stock count ${count.count_number}; variance ${variance}`,"
          new_note = "notes: `Stock count ${count.count_number}; physical variance ${variance}; system movement during count ${movementDuringCount}; snapshot expected ${snapshotExpected}; effective expected ${balanceBefore}`,"
          if old_note in text:
              text = text.replace(old_note, new_note, 1)

          old_line = "await tx.$executeRaw(Prisma.sql`UPDATE public.stock_count_lines SET counted_quantity = ${counted}, variance_quantity = ${variance} WHERE id = ${line.id}`);"
          new_line = "await tx.$executeRaw(Prisma.sql`UPDATE public.stock_count_lines SET expected_quantity = ${balanceBefore}, counted_quantity = ${counted}, variance_quantity = ${variance} WHERE id = ${line.id}`);"
          if old_line in text:
              text = text.replace(old_line, new_line, 1)

          required = [
              'const variance = counted - balanceBefore',
              'const movementDuringCount = balanceBefore - snapshotExpected',
              'SET expected_quantity = ${balanceBefore}, counted_quantity = ${counted}, variance_quantity = ${variance}',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Stock-count reconciliation markers missing: {missing}')
          path.write_text(text)
          PY

      - name: Reconcile RFQ capacity and audit hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/modules/fnb/controllers/procurement-rfq.p1.controller.ts')
          text = path.read_text()

          quote_marker = """    const itemQuotes = Array.isArray(req.body.items) ? req.body.items : [];\n    if (itemQuotes.length === 0) return res.status(400).json({ success: false, error: { code: 'QUOTE_ITEMS_REQUIRED', message: 'Supplier quote membutuhkan item prices' } });"""
          if "code: 'INVALID_LEAD_TIME'" not in text:
              if quote_marker not in text:
                  raise SystemExit('RFQ quote marker not found')
              quote_replacement = quote_marker + """\n    const leadTimeDays = req.body.leadTimeDays === undefined || req.body.leadTimeDays === null || req.body.leadTimeDays === ''\n      ? null\n      : Number(req.body.leadTimeDays);\n    if (leadTimeDays !== null && (!Number.isFinite(leadTimeDays) || leadTimeDays < 0)) {\n      return res.status(400).json({ success: false, error: { code: 'INVALID_LEAD_TIME', message: 'Lead time supplier harus angka >= 0' } });\n    }"""
              text = text.replace(quote_marker, quote_replacement, 1)

          text = text.replace(
              "lead_time_days = ${req.body.leadTimeDays === undefined ? null : Number(req.body.leadTimeDays)}",
              "lead_time_days = ${leadTimeDays}",
              1,
          )
          text = text.replace(
              "payload: { supplierId, quotedTotal, leadTimeDays: req.body.leadTimeDays ?? null },",
              "payload: { supplierId, quotedTotal, leadTimeDays, items: itemQuotes },",
              1,
          )

          if "code: 'SUPPLIER_CAPACITY_INSUFFICIENT'" not in text:
              marker = """      const supplierRows = await tx.$queryRaw<any[]>(Prisma.sql`SELECT * FROM public.purchase_rfq_suppliers WHERE rfq_id = ${rfqId} AND supplier_id = ${supplierId} AND status = 'responded' FOR UPDATE`);\n      if (!supplierRows[0]) throw Object.assign(new Error('Supplier belum memberikan quote valid'), { status: 409, code: 'SUPPLIER_QUOTE_REQUIRED' });"""
              if marker not in text:
                  raise SystemExit('RFQ supplier selection marker not found')
              replacement = marker + """\n\n      const capacityShortages = await tx.$queryRaw<any[]>(Prisma.sql`\n        SELECT ri.inventory_id, ri.quantity AS requested_quantity, rsi.available_quantity\n        FROM public.purchase_rfq_items ri\n        JOIN public.purchase_rfq_supplier_items rsi\n          ON rsi.rfq_item_id = ri.id AND rsi.rfq_supplier_id = ${supplierRows[0].id}\n        WHERE ri.rfq_id = ${rfqId}\n          AND rsi.available_quantity IS NOT NULL\n          AND rsi.available_quantity < ri.quantity\n      `);\n      if (capacityShortages.length > 0) {\n        throw Object.assign(new Error('Supplier tidak memiliki kapasitas cukup untuk seluruh kebutuhan RFQ'), {\n          status: 409,\n          code: 'SUPPLIER_CAPACITY_INSUFFICIENT',\n          details: capacityShortages,\n        });\n      }"""
              text = text.replace(marker, replacement, 1)

          required = [
              "code: 'INVALID_LEAD_TIME'",
              'lead_time_days = ${leadTimeDays}',
              'payload: { supplierId, quotedTotal, leadTimeDays, items: itemQuotes }',
              "code: 'SUPPLIER_CAPACITY_INSUFFICIENT'",
              'rsi.available_quantity < ri.quantity',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'RFQ hardening markers missing: {missing}')
          path.write_text(text)
          PY

      - name: Ensure regression tests exist
        run: |
          cat > backend/tests/unit/p1-stock-count-concurrency.test.ts <<'EOF'
          import fs from 'fs';
          import path from 'path';
          const controller = fs.readFileSync(path.resolve(__dirname, '../../src/modules/fnb/controllers/warehouse.p1.controller.ts'), 'utf8');
          describe('P1 stock count concurrency', () => {
            test('aggregate correction uses current locked location balance', () => {
              expect(controller).toContain('const variance = counted - balanceBefore');
              expect(controller).not.toContain('const variance = counted - expected');
              expect(controller).toContain('system movement during count');
              expect(controller).toContain('SET expected_quantity = ${balanceBefore}, counted_quantity = ${counted}, variance_quantity = ${variance}');
            });
          });
          EOF

          cat > backend/tests/unit/p1-rfq-hardening.test.ts <<'EOF'
          import fs from 'fs';
          import path from 'path';
          const controller = fs.readFileSync(path.resolve(__dirname, '../../src/modules/fnb/controllers/procurement-rfq.p1.controller.ts'), 'utf8');
          describe('P1 RFQ hardening', () => {
            test('validates lead time and keeps item-level quote audit detail', () => {
              expect(controller).toContain("code: 'INVALID_LEAD_TIME'");
              expect(controller).toContain('payload: { supplierId, quotedTotal, leadTimeDays, items: itemQuotes }');
            });
            test('blocks supplier selection when quoted capacity is insufficient', () => {
              expect(controller).toContain("code: 'SUPPLIER_CAPACITY_INSUFFICIENT'");
              expect(controller).toContain('rsi.available_quantity < ri.quantity');
            });
          });
          EOF

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Build disposable legacy baseline
        working-directory: backend
        run: npx prisma db push --skip-generate

      - name: Apply P1 migrations
        working-directory: backend
        run: node dist/scripts/apply-p1-migrations.js

      - name: Prove migration idempotency
        working-directory: backend
        run: node dist/scripts/apply-p1-migrations.js

      - name: Verify immutable DB behavior
        working-directory: backend
        run: node dist/scripts/verify-p1-database-v2.js

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Production Docker build
        run: docker build --file backend/Dockerfile --tag omnipilot-p1-reconciled:ci backend

      - name: Remove obsolete RFQ V1 and one-shot workflows
        run: |
          rm -f frontend/src/components/supply-chain/ProcurementRfqPanel.tsx
          rm -f .github/workflows/p1-wire-rfq-once.yml
          rm -f .github/workflows/p1-fix-stock-count-once.yml
          rm -f .github/workflows/p1-harden-rfq-once.yml
          rm -f .github/workflows/p1-reconcile-once.yml

      - name: Rebase any concurrent safe commits
        run: git pull --rebase --autostash origin feat/odoo-complete-suite

      - name: Re-run compile gates after rebase
        run: |
          cd backend
          npm run build
          npm test -- --runInBand
          node dist/scripts/apply-p1-migrations.js
          node dist/scripts/verify-p1-database-v2.js
          cd ../frontend
          npm run build

      - name: Commit only fully reconciled state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git commit -m "feat(p1): reconcile and gate revenue/supply-chain tranche"
          git push origin HEAD:feat/odoo-complete-suite
