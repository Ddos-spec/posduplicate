name: P3 Wire Digital Route Once
on:
  push:
    branches: [feat/odoo-complete-suite]
    paths: ['.github/workflows/p3-wire-digital-route-once.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0
      - name: Wire runtime
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          app=Path('frontend/src/App.tsx'); text=app.read_text()
          marker="const WorkforceWorkspacePage = lazy(() => import('./pages/WorkforceWorkspacePage'));"
          if 'DigitalWebsiteWorkspacePage' not in text:
            text=text.replace(marker, marker+"\nconst DigitalWebsiteWorkspacePage = lazy(() => import('./pages/DigitalWebsiteWorkspacePage'));",1)
          route='          <Route path="/workforce" element={<TenantModuleRoute moduleKey="accounting"><ProtectedRoute><WorkforceWorkspacePage /></ProtectedRoute></TenantModuleRoute>} />'
          if 'path="/digital"' not in text:
            text=text.replace(route, route+'\n          <Route path="/digital" element={<TenantModuleRoute moduleKey="commerSocial"><OwnerRoute><DigitalWebsiteWorkspacePage /></OwnerRoute></TenantModuleRoute>} />',1)
          app.write_text(text)
          catalog=Path('frontend/src/config/suiteCatalog.ts'); lines=[]; found=False
          for line in catalog.read_text().splitlines():
            if "{ id: 'website'" in line:
              found=True; line=re.sub(r"status: '(?:live|partial|blueprint)'","status: 'partial'",line,count=1)
              line=line.replace('capabilities:',"path: '/digital', capabilities:",1) if "path: '" not in line else re.sub(r"path: '[^']+'","path: '/digital'",line,count=1)
            lines.append(line)
          if not found: raise SystemExit('website catalog row missing')
          catalog.write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build check
        working-directory: frontend
        run: |
          npm ci
          npm run build:check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/config/suiteCatalog.ts
          git diff --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(p3): wire digital website workspace runtime"
          git push origin HEAD:feat/odoo-complete-suite
