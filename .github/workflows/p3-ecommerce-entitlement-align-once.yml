name: P3 eCommerce Entitlement Align Once

on:
  push:
    branches: [feat/odoo-complete-suite]
    paths:
      - '.github/workflows/p3-ecommerce-entitlement-align-once.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Align eCommerce launcher entitlement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/config/suiteCatalog.ts')
          text = p.read_text()
          old = "{ id: 'ecommerce', category: 'websites', name: 'eCommerce', description: 'Online catalog, cart, checkout, customer accounts, delivery, and order lifecycle.', icon: ShoppingBag, bundle: 'pos', status: 'blueprint', capabilities: ['Catalog', 'Cart', 'Checkout', 'Fulfillment'] }"
          new = "{ id: 'ecommerce', category: 'websites', name: 'eCommerce', description: 'Online catalog, cart, checkout, customer accounts, delivery, and order lifecycle.', icon: ShoppingBag, bundle: 'commerSocial', status: 'blueprint', path: '/digital', capabilities: ['Catalog', 'Cart', 'Checkout', 'Fulfillment'] }"
          if old not in text:
              raise SystemExit('ecommerce catalog anchor missing')
          p.write_text(text.replace(old, new, 1))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build:check

      - name: Commit entitlement alignment
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/config/suiteCatalog.ts
          git commit -m "fix(p3): align ecommerce digital entitlement"
          git push origin HEAD:feat/odoo-complete-suite
