name: P2 Harden Payroll Routes Once
# rerun after workforce schema-alignment fix

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p2-harden-payroll-routes-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Add payroll capability gates
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('backend/src/modules/accounting/routes/accounting.payroll.routes.ts')
          text = path.read_text()
          anchor = "import { tenantMiddleware } from '../../../middlewares/tenant.middleware';"
          if 'capability.middleware' not in text:
              text = text.replace(anchor, anchor + "\nimport { requireCapability } from '../../../middlewares/capability.middleware';", 1)
          replacements = {
            "router.get('/employees', getEmployees);": "router.get('/employees', requireCapability('workforce.employee.read'), getEmployees);",
            "router.post('/employees', upsertEmployee);": "router.post('/employees', requireCapability('workforce.employee.manage'), upsertEmployee);",
            "router.put('/employees/:id', upsertEmployee);": "router.put('/employees/:id', requireCapability('workforce.employee.manage'), upsertEmployee);",
            "router.get('/periods', getPayrollPeriods);": "router.get('/periods', requireCapability('workforce.payroll.read'), getPayrollPeriods);",
            "router.post('/periods', createPayrollPeriod);": "router.post('/periods', requireCapability('workforce.payroll.manage'), createPayrollPeriod);",
            "router.post('/periods/:periodId/calculate', calculatePayroll);": "router.post('/periods/:periodId/calculate', requireCapability('workforce.payroll.manage'), calculatePayroll);",
            "router.get('/periods/:periodId/details', getPayrollDetails);": "router.get('/periods/:periodId/details', requireCapability('workforce.payroll.read'), getPayrollDetails);",
            "router.post('/periods/:periodId/finalize', finalizePayroll);": "router.post('/periods/:periodId/finalize', requireCapability('workforce.payroll.manage'), finalizePayroll);",
            "router.get('/periods/:periodId/payslip/:employeeId', generatePayslip);": "router.get('/periods/:periodId/payslip/:employeeId', requireCapability('workforce.payroll.read'), generatePayslip);",
            "router.post('/thr/calculate', calculateTHR);": "router.post('/thr/calculate', requireCapability('workforce.payroll.manage'), calculateTHR);",
            "router.post('/overtime', recordOvertime);": "router.post('/overtime', requireCapability('workforce.payroll.manage'), recordOvertime);",
            "router.get('/reports/summary', getPayrollReport);": "router.get('/reports/summary', requireCapability('workforce.payroll.read'), getPayrollReport);",
            "router.get('/reports/pph21', getPPh21Report);": "router.get('/reports/pph21', requireCapability('workforce.payroll.read'), getPPh21Report);",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Payroll route anchor not found: {old}')
          path.write_text(text)
          PY
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Backend build
        working-directory: backend
        run: npm run build
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/accounting/routes/accounting.payroll.routes.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(p2): capability-gate payroll routes"
          git push origin HEAD:feat/odoo-complete-suite
