name: Fix MCS Launcher Permissions Once

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/fix-mcs-launcher-permissions-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Patch launcher permissions and regression contract
        run: |
          python3 <<'PY'
          from pathlib import Path

          page = Path('frontend/src/pages/ModuleSelectorPage.tsx')
          text = page.read_text()

          marker = "export default function ModuleSelectorPage() {"
          helper = """type McsPermissionSet = Partial<Record<'inbox' | 'analytics' | 'content' | 'ads' | 'settings' | 'marketplace', boolean>>;\n\nconst canMcsMemberAccessPath = (path: string | undefined, permissions: McsPermissionSet | undefined) => {\n  if (!path || !permissions) return false;\n  if (path === '/medsos/marketplace' || path.startsWith('/medsos/marketplace/')) return permissions.marketplace === true;\n  if (\n    path === '/medsos/calendar'\n    || path === '/medsos/create'\n    || path === '/medsos/crm/planner'\n    || path.startsWith('/medsos/crm/content/')\n  ) return permissions.content === true;\n  if (\n    path === '/medsos/crm'\n    || path === '/medsos/broadcasts'\n    || path === '/medsos/automations'\n    || path === '/medsos/inbox'\n    || path.startsWith('/medsos/inbox/')\n  ) return permissions.inbox === true;\n  if (path.startsWith('/medsos/analytics/')) return permissions.analytics === true;\n  if (path === '/medsos/ads' || path.startsWith('/medsos/ads/')) return permissions.ads === true;\n  if (path === '/medsos/settings' || path.startsWith('/medsos/settings/')) return permissions.settings === true;\n  return false;\n};\n\n"""
          if 'const canMcsMemberAccessPath' not in text:
              if marker not in text:
                  raise SystemExit('ModuleSelector component marker not found')
              text = text.replace(marker, helper + marker, 1)

          role_old = """  const roleName = (user?.roles?.name || user?.role?.name || '').toLowerCase();\n  const isSuperAdmin = roleName === 'super admin' || roleName === 'super_admin' || roleName === 'admin';\n  const tenantId = user?.tenant?.id ?? user?.tenant_id ?? null;\n"""
          role_new = """  const roleName = (user?.roles?.name || user?.role?.name || '').toLowerCase();\n  const isSuperAdmin = roleName === 'super admin' || roleName === 'super_admin' || roleName === 'admin';\n  const isMcsMember = roleName === 'mcs_member';\n  const mcsPermissions = user?.dashboard_preferences?.mcs;\n  const tenantId = user?.tenant?.id ?? user?.tenant_id ?? null;\n"""
          if role_old in text:
              text = text.replace(role_old, role_new, 1)
          elif 'const isMcsMember = roleName' not in text:
              raise SystemExit('Role block not found')

          access_old = """  const accessibleApps = useMemo(\n    () => runtimeApps.filter((app) => isSuperAdmin || enabledModules[app.bundle]),\n    [enabledModules, isSuperAdmin, runtimeApps]\n  );\n"""
          access_new = """  const accessibleApps = useMemo(\n    () => runtimeApps.filter((app) => {\n      if (isSuperAdmin) return true;\n      if (!enabledModules[app.bundle]) return false;\n      if (!isMcsMember || app.bundle !== 'commerSocial' || !app.path || app.status === 'blueprint') return true;\n      return canMcsMemberAccessPath(app.path, mcsPermissions);\n    }),\n    [enabledModules, isMcsMember, isSuperAdmin, mcsPermissions, runtimeApps]\n  );\n"""
          if access_old in text:
              text = text.replace(access_old, access_new, 1)
          elif 'return canMcsMemberAccessPath(app.path, mcsPermissions);' not in text:
              raise SystemExit('Accessible-app block not found')

          open_old = """  const openApp = (app: typeof runtimeApps[number]) => {\n    if (!app.path || app.status === 'blueprint') return;\n    navigate(app.path);\n  };\n"""
          open_new = """  const openApp = (app: typeof runtimeApps[number]) => {\n    if (!app.path || app.status === 'blueprint') return;\n    if (!isSuperAdmin && !enabledModules[app.bundle]) return;\n    if (!isSuperAdmin && isMcsMember && app.bundle === 'commerSocial' && !canMcsMemberAccessPath(app.path, mcsPermissions)) return;\n    navigate(app.path);\n  };\n"""
          if open_old in text:
              text = text.replace(open_old, open_new, 1)
          elif "!canMcsMemberAccessPath(app.path, mcsPermissions)" not in text:
              raise SystemExit('Open-app block not found')

          page.write_text(text)

          test = Path('backend/tests/unit/module-selector-mcs-access.test.ts')
          test.write_text("""import fs from 'fs';\nimport path from 'path';\n\nconst repoRoot = path.resolve(__dirname, '../../..');\nconst source = fs.readFileSync(path.join(repoRoot, 'frontend/src/pages/ModuleSelectorPage.tsx'), 'utf8');\n\ndescribe('ModuleSelector MCS member access contract', () => {\n  test('tenant entitlement remains mandatory before per-user MCS permissions', () => {\n    expect(source).toContain(\"if (!enabledModules[app.bundle]) return false;\");\n    expect(source).toContain(\"if (!isSuperAdmin && !enabledModules[app.bundle]) return;\");\n  });\n\n  test('marketplace, inbox, content, analytics, ads and settings are permission mapped', () => {\n    expect(source).toContain(\"permissions.marketplace === true\");\n    expect(source).toContain(\"permissions.inbox === true\");\n    expect(source).toContain(\"permissions.content === true\");\n    expect(source).toContain(\"permissions.analytics === true\");\n    expect(source).toContain(\"permissions.ads === true\");\n    expect(source).toContain(\"permissions.settings === true\");\n  });\n\n  test('missing MCS permission data fails closed and unrelated roles retain tenant behavior', () => {\n    expect(source).toContain(\"if (!path || !permissions) return false;\");\n    expect(source).toContain(\"if (!isMcsMember || app.bundle !== 'commerSocial' || !app.path || app.status === 'blueprint') return true;\");\n  });\n\n  test('stale cards cannot bypass the same MCS predicate during navigation', () => {\n    expect(source).toContain(\"app.bundle === 'commerSocial' && !canMcsMemberAccessPath(app.path, mcsPermissions)\");\n    expect(source).toContain('navigate(app.path);');\n  });\n\n  test('team, connections, dashboard and unknown MCS routes are not implicitly granted', () => {\n    expect(source).not.toContain(\"path === '/medsos/team' || permissions\");\n    expect(source).not.toContain(\"path === '/medsos/connections' || permissions\");\n    expect(source).not.toContain(\"path === '/medsos/dashboard' || permissions\");\n    expect(source).toContain('return false;\\n};');\n  });\n});\n""")
          PY

      - name: Repair exact-head frontend typecheck blockers
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str, already: str | None = None):
              path = Path(path_str)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  return
              if already and already in text:
                  return
              raise SystemExit(f'Expected pattern not found in {path_str}')

          replace_once(
              'frontend/src/pages/SupplyChainWorkspacePage.tsx',
              '  CheckCircle2,\n',
              '',
          )
          replace_once(
              'frontend/src/pages/workforce/ServicesAppointmentsPanel.tsx',
              'import { CalendarCheck, CalendarClock, CheckCircle2, Clock3, RefreshCw, UserRoundCheck, XCircle } from \'lucide-react\';',
              'import { CalendarCheck, CalendarClock, Clock3, RefreshCw, UserRoundCheck, XCircle } from \'lucide-react\';',
              "import { CalendarCheck, CalendarClock, Clock3, RefreshCw, UserRoundCheck, XCircle } from 'lucide-react';",
          )
          replace_once(
              'frontend/src/pages/workforce/ServicesFieldServicePanel.tsx',
              'import { CalendarClock, Crosshair, MapPin, RefreshCw, Route, Truck, Wrench, XCircle } from \'lucide-react\';',
              'import { Crosshair, MapPin, RefreshCw, Route, Truck, Wrench, XCircle } from \'lucide-react\';',
              "import { Crosshair, MapPin, RefreshCw, Route, Truck, Wrench, XCircle } from 'lucide-react';",
          )
          replace_once(
              'frontend/src/pages/medsos/OmnichannelAdsHub.tsx',
              '  invalidateMcsRequestCache,\n',
              '',
          )
          replace_once(
              'frontend/src/pages/medsos/OmnichannelAdsHub.tsx',
              "          executionStatus: decision === 'approve' ? 'ready_for_manual_execution' : nextStatus,",
              "          executionStatus: decision === 'approve' ? 'ready_for_manual_execution' : decision === 'revise' ? 'revision_requested' : 'deferred',",
              "executionStatus: decision === 'approve' ? 'ready_for_manual_execution' : decision === 'revise' ? 'revision_requested' : 'deferred'",
          )
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend regression test
        working-directory: backend
        run: |
          npm ci
          npm test -- --runInBand tests/unit/module-selector-mcs-access.test.ts

      - name: Frontend exact build check
        working-directory: frontend
        run: |
          npm ci
          npm run build:check

      - name: Diff hygiene
        run: git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/pages/ModuleSelectorPage.tsx \
            backend/tests/unit/module-selector-mcs-access.test.ts \
            frontend/src/pages/SupplyChainWorkspacePage.tsx \
            frontend/src/pages/medsos/OmnichannelAdsHub.tsx \
            frontend/src/pages/workforce/ServicesAppointmentsPanel.tsx \
            frontend/src/pages/workforce/ServicesFieldServicePanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce MCS launcher access and restore frontend typecheck"
          git push origin HEAD:feat/odoo-complete-suite
