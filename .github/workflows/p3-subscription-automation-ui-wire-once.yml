name: P3 Subscription Automation UI Wire Once

on:
  push:
    branches: [feat/p3-subscription-automation]
    paths:
      - '.github/workflows/p3-subscription-automation-ui-wire-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-subscription-automation
          fetch-depth: 0
      - name: Wire automation panel into workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/SubscriptionsWorkspacePage.tsx')
          text=p.read_text()
          if 'SubscriptionAutomationPanel' not in text:
              text=text.replace("import { useNavigate } from 'react-router-dom';\n", "import { useNavigate } from 'react-router-dom';\nimport SubscriptionAutomationPanel from './subscriptions/SubscriptionAutomationPanel';\n",1)
              marker='      {error && <div className="mt-4 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm font-semibold text-rose-700">{error}</div>}\n'
              if marker not in text: raise SystemExit('workspace render anchor missing')
              text=text.replace(marker, marker+'      <div className="mt-5"><SubscriptionAutomationPanel /></div>\n',1)
              p.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build:check
      - name: Commit UI wiring
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/pages/SubscriptionsWorkspacePage.tsx
          git commit -m "feat(p3): surface subscription auto-renew controls"
          git pull --rebase origin feat/p3-subscription-automation
          git push origin HEAD:feat/p3-subscription-automation
