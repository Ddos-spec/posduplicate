name: P3 Wire Ecommerce Core Once
on:
  push:
    branches: [feat/odoo-complete-suite]
    paths: ['.github/workflows/p3-wire-ecommerce-core-once.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0
      - name: Patch ecommerce routes and fulfillment outlet
        run: |
          python3 <<'PY'
          from pathlib import Path

          routes=Path('backend/src/modules/fnb/routes/digital.routes.ts')
          text=routes.read_text()
          if 'ecommerce-create.p3.controller' not in text:
            text=text.replace("import { Router } from 'express';", "import { Router } from 'express';\nimport { createPublicStorefrontOrder } from '../controllers/ecommerce-create.p3.controller';\nimport { getPublicStorefrontOrderStatus } from '../controllers/ecommerce-status.p3.controller';",1)
          marker="router.get('/storefront/:publicSlug/catalog', getPublicStorefrontCatalog);"
          if "storefront/:publicSlug/orders'" not in text:
            text=text.replace(marker, marker+"\nrouter.post('/storefront/:publicSlug/orders', createPublicStorefrontOrder);\nrouter.get('/storefront/:publicSlug/orders/:orderNumber', getPublicStorefrontOrderStatus);",1)
          routes.write_text(text)

          controller=Path('backend/src/modules/fnb/controllers/digital-website.p3.controller.ts')
          text=controller.read_text()
          old="const theme=encodeDocument(req.body.themeConfig ?? {},false);\n    const rows=await prisma.$queryRaw<any[]>(Prisma.sql`UPDATE public.website_sites SET name=${name},default_locale=${cleanText(req.body.defaultLocale,16)||'id-ID'},theme_config=CAST(${theme} AS jsonb),updated_by=${userId},updated_at=NOW() WHERE id=${siteId} AND tenant_id=${tenantId} AND status<>'archived' RETURNING *`);"
          new="const theme=encodeDocument(req.body.themeConfig ?? {},false);\n    const fulfillmentOutletId=positiveInt(req.body.fulfillmentOutletId,'INVALID_FULFILLMENT_OUTLET_ID');\n    const outlet=await prisma.$queryRaw<any[]>(Prisma.sql`SELECT id FROM public.outlets WHERE id=${fulfillmentOutletId} AND tenant_id=${tenantId} LIMIT 1`);\n    if(!outlet[0]) return res.status(404).json({success:false,error:{code:'FULFILLMENT_OUTLET_NOT_FOUND',message:'Outlet not found in tenant'}});\n    const rows=await prisma.$queryRaw<any[]>(Prisma.sql`UPDATE public.website_sites SET name=${name},default_locale=${cleanText(req.body.defaultLocale,16)||'id-ID'},theme_config=CAST(${theme} AS jsonb),fulfillment_outlet_id=${fulfillmentOutletId},updated_by=${userId},updated_at=NOW() WHERE id=${siteId} AND tenant_id=${tenantId} AND status<>'archived' RETURNING *`);"
          if 'fulfillmentOutletId=positiveInt' not in text:
            if old not in text: raise SystemExit('site update marker missing')
            text=text.replace(old,new,1)
          controller.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend build
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/fnb/routes/digital.routes.ts backend/src/modules/fnb/controllers/digital-website.p3.controller.ts
          git diff --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(p3): wire ecommerce reservation routes and fulfillment outlet"
          git push origin HEAD:feat/odoo-complete-suite
