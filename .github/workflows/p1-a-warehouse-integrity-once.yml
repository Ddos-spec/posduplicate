name: P1-A Warehouse Integrity Gate

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p1-a-warehouse-integrity-once.yml'

permissions:
  contents: write

jobs:
  warehouse-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Apply warehouse integrity patch
        run: python .github/scripts/apply_p1a_warehouse_integrity.py

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Backend TypeScript build
        working-directory: backend
        run: npm run build

      - name: Run warehouse integrity tests
        working-directory: backend
        run: npm test -- --runInBand p1-warehouse-integrity.test.ts

      - name: Run full backend test suite
        working-directory: backend
        run: npm test -- --runInBand

      - name: Verify intended diff
        run: |
          git diff --check
          git diff -- backend/src/modules/fnb/controllers/warehouse.p1.controller.ts backend/tests/unit/p1-warehouse-integrity.test.ts

      - name: Remove one-shot helper files
        run: |
          rm .github/workflows/p1-a-warehouse-integrity-once.yml
          rm .github/scripts/apply_p1a_warehouse_integrity.py

      - name: Commit tested warehouse hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/fnb/controllers/warehouse.p1.controller.ts backend/tests/unit/p1-warehouse-integrity.test.ts .github/workflows/p1-a-warehouse-integrity-once.yml .github/scripts/apply_p1a_warehouse_integrity.py
          git diff --cached --check
          git commit -m "test(p1-a): harden warehouse transfer and cycle count"
          git push origin HEAD:feat/odoo-complete-suite
