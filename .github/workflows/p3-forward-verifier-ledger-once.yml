name: P3 Forward Verifier Ledger Once
on:
  push:
    branches: [feat/odoo-complete-suite]
    paths: ['.github/workflows/p3-forward-verifier-ledger-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0
      - name: Make P3 verifier forward compatible
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('backend/src/scripts/verify-p3-database.ts')
          s=p.read_text()
          old="assert(ledger.rows.length === 1, `Expected 1 P3 migration ledger entry, found ${ledger.rows.length}`);"
          new="assert(ledger.rows.length >= 1, `Expected at least 1 P3 migration ledger entry, found ${ledger.rows.length}`);"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('ledger assertion marker missing')
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend build
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/scripts/verify-p3-database.ts
          git diff --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(p3): make database verifier forward compatible"
          git push origin HEAD:feat/odoo-complete-suite
