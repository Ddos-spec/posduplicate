name: P2 Promote Runtime Catalog Once

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p2-promote-runtime-catalog-once.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Promote accepted P2 runtime apps
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          catalog = Path('frontend/src/config/suiteCatalog.ts')
          text = catalog.read_text()
          targets = {
              'recruitment', 'time-off', 'appraisals', 'payroll',
              'project', 'timesheets', 'planning', 'field-service',
              'helpdesk', 'appointments',
          }

          output = []
          seen = set()
          for line in text.splitlines():
              match = re.search(r"\{ id: '([^']+)'", line)
              if match and match.group(1) in targets:
                  app_id = match.group(1)
                  seen.add(app_id)
                  line = re.sub(r"status: '(?:live|partial|blueprint)'", "status: 'live'", line, count=1)
                  line = re.sub(r"bundle: '(?:pos|accounting|inventory|commerSocial)'", "bundle: 'accounting'", line, count=1)
                  if "path: '" in line:
                      line = re.sub(r"path: '[^']+'", "path: '/workforce'", line, count=1)
                  else:
                      line = line.replace('capabilities:', "path: '/workforce', capabilities:", 1)
              output.append(line)

          missing = sorted(targets - seen)
          if missing:
              raise SystemExit(f'Catalog targets missing: {missing}')
          catalog.write_text('\n'.join(output) + '\n')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/config/suiteCatalog.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(p2): promote accepted runtime apps"
          git push origin HEAD:feat/odoo-complete-suite
