name: P3 Storefront Runtime Once
on:
  push:
    branches: [feat/odoo-complete-suite]
    paths: ['.github/workflows/p3-storefront-runtime-once.yml']
permissions:
  contents: write
jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0
      - name: Wire public storefront and merchant order workflow
        run: |
          rm -f .github/workflows/p3-harden-ecommerce-once.yml
          python3 <<'PY'
          from pathlib import Path
          import base64
          storefront_b64 = ''
          manager_b64 = ''
          contract_b64 = ''
          Path('frontend/src/pages/StorefrontPage.tsx').write_bytes(base64.b64decode(storefront_b64))
          Path('frontend/src/pages/digital/EcommerceOrderManager.tsx').write_bytes(base64.b64decode(manager_b64))
          Path('backend/tests/unit/p3-ecommerce-frontend-contract.test.ts').write_bytes(base64.b64decode(contract_b64))

          service = Path('frontend/src/services/digitalWebsiteService.ts')
          text = service.read_text()
          if 'export type EcommerceOrderStatus' not in text:
              marker = 'const unwrap = <T>(response: { data: { data: T } }): T => response.data.data;'
              types = """export type EcommerceOrderStatus = 'reserved' | 'confirmed' | 'preparing' | 'ready' | 'completed' | 'cancelled';
export interface PublicOrderCreateInput {
  customerName: string; customerPhone: string; customerEmail?: string; deliveryAddress: Record<string, unknown>;
  notes?: string; items: Array<{ itemId: number; quantity: number }>;
}
export interface PublicOrderReceipt { orderNumber: string; token: string; status: EcommerceOrderStatus; total: number | string; }
export interface PublicOrderStatusRecord {
  order_number: string; status: EcommerceOrderStatus; total: number | string; created_at: string;
  confirmed_at?: string | null; ready_at?: string | null; completed_at?: string | null; cancelled_at?: string | null;
}
export interface EcommerceOrder extends PublicOrderStatusRecord {
  id: number; site_id: number; outlet_id: number; customer_name: string; customer_phone: string;
  customer_email?: string | null; site_name: string; outlet_name: string;
}

"""
              if marker not in text:
                  raise SystemExit('digital service unwrap marker missing')
              text = text.replace(marker, types + marker, 1)
          if 'createPublicStorefrontOrder' not in text:
              text = text.rstrip() + """

export const createPublicStorefrontOrder = async (publicSlug: string, payload: PublicOrderCreateInput) =>
  unwrap<PublicOrderReceipt>(await api.post(`/digital/storefront/${encodeURIComponent(publicSlug)}/orders`, payload));
export const getPublicStorefrontOrderStatus = async (publicSlug: string, orderNumber: string, token: string) =>
  unwrap<PublicOrderStatusRecord>(await api.get(`/digital/storefront/${encodeURIComponent(publicSlug)}/orders/${encodeURIComponent(orderNumber)}`, { headers: { 'x-order-token': token } }));
export const getEcommerceOrders = async () => unwrap<EcommerceOrder[]>(await api.get('/digital/orders'));
export const progressEcommerceOrder = async (id: number, status: EcommerceOrderStatus) =>
  unwrap<EcommerceOrder>(await api.patch(`/digital/orders/${id}/status`, { status }));
"""
          service.write_text(text)

          app = Path('frontend/src/App.tsx')
          text = app.read_text()
          marker = "const DigitalWebsiteWorkspacePage = lazy(() => import('./pages/DigitalWebsiteWorkspacePage'));"
          if 'const StorefrontPage' not in text:
              if marker not in text:
                  raise SystemExit('App digital lazy marker missing')
              text = text.replace(marker, marker + "\nconst StorefrontPage = lazy(() => import('./pages/StorefrontPage'));", 1)
          route_marker = '          <Route path="/module-selector" element={<ProtectedRoute><ModuleSelectorPage /></ProtectedRoute>} />'
          public_route = '          <Route path="/store/:publicSlug" element={<StorefrontPage />} />\n'
          if '<Route path="/store/:publicSlug"' not in text:
              if route_marker not in text:
                  raise SystemExit('App module-selector route marker missing')
              text = text.replace(route_marker, public_route + route_marker, 1)
          app.write_text(text)

          workspace = Path('frontend/src/pages/DigitalWebsiteWorkspacePage.tsx')
          text = workspace.read_text()
          if 'EcommerceOrderManager' not in text:
              text = text.replace("import CatalogManager from './digital/CatalogManager';", "import CatalogManager from './digital/CatalogManager';\nimport EcommerceOrderManager from './digital/EcommerceOrderManager';", 1)
              marker = '      {siteId && <div className="mt-5 grid gap-5 lg:grid-cols-2"><PageManager siteId={siteId} /><CatalogManager siteId={siteId} /></div>}\n'
              if marker not in text:
                  raise SystemExit('workspace catalog marker missing')
              text = text.replace(marker, marker + '      <div className="mt-5"><EcommerceOrderManager /></div>\n', 1)
          workspace.write_text(text)

          server = Path('backend/src/server.ts')
          text = server.read_text()
          if "'X-Order-Token'" not in text:
              text = text.replace("    'If-Modified-Since'\n", "    'If-Modified-Since',\n    'X-Order-Token'\n", 1)
          server.write_text(text)

          api = Path('frontend/src/services/api.ts')
          text = api.read_text()
          old = "    if (error.response?.status === 401) {\n      useAuthStore.getState().logout();\n      window.location.href = '/login';\n    }"
          new = "    if (error.response?.status === 401 && error.config?.headers?.Authorization) {\n      useAuthStore.getState().logout();\n      window.location.href = '/login';\n    }"
          if old in text:
              text = text.replace(old, new, 1)
          api.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend install and Prisma client
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
      - name: P3 runtime contract tests
        working-directory: backend
        run: npx jest tests/unit/p3-ecommerce-transition-behavior.test.ts tests/unit/p3-website-commerce-contract.test.ts tests/unit/p3-ecommerce-frontend-contract.test.ts --runInBand
      - name: Backend TypeScript build
        working-directory: backend
        run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build:check
      - name: Commit storefront runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(p3): add public storefront checkout and order operations"
          git push origin HEAD:feat/odoo-complete-suite
