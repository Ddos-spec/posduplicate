name: C3 Diagnose Once

on:
  push:
    branches: [ "feat/**" ]
    paths:
      - '.github/workflows/c3-diagnose-once.yml'

jobs:
  isolate:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        test:
          - p2-payroll-official-posting.test.ts
          - p2-payroll-official-contract.test.ts
          - p1-append-only.test.ts
          - p2-appointments-contract.test.ts
          - p2-appraisal-contract.test.ts
          - p2-field-service-contract.test.ts
          - p2-helpdesk-contract.test.ts
          - p2-payroll-calculation-runs.test.ts
          - p2-payroll-final-contract.test.ts
          - p2-payroll-governance.test.ts
          - p2-services-project-contract.test.ts
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Run isolated unit test
        run: npx jest tests/unit/${{ matrix.test }} --runInBand
