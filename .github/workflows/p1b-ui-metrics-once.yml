name: P1-B UI Metrics Once

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p1b-ui-metrics-once.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch supply-chain production UX
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/SupplyChainWorkspacePage.tsx')
          text = path.read_text()

          old_qc = '''  const resolveQC = async (qc: QualityCheck, status: 'pass' | 'fail' | 'waived') => {
            const notes = window.prompt(`Catatan QC (${status})`, qc.notes || '') || undefined;
            try {
              await resolveQualityCheck(qc.id, status, notes);
              await load();
              toast.success(`QC ${status}`);
            } catch (error) {
              console.error(error);
              toast.error('QC gagal diupdate');
            }
          };'''
          new_qc = '''  const resolveQC = async (qc: QualityCheck, status: 'pass' | 'fail' | 'waived') => {
            const answer = window.prompt(`Catatan QC (${status})`, qc.notes || '');
            if (answer === null) return;
            const notes = answer.trim();
            if ((status === 'fail' || status === 'waived') && !notes) return toast.error('Fail / waive wajib memiliki alasan');
            try {
              await resolveQualityCheck(qc.id, status, notes || undefined);
              await load();
              toast.success(`QC ${status}`);
            } catch (error) {
              console.error(error);
              toast.error('QC gagal diupdate');
            }
          };'''
          if old_qc not in text:
              raise SystemExit('resolveQC anchor not found')
          text = text.replace(old_qc, new_qc, 1)

          old_mo = '''<p className={`mt-1 text-xs ${muted}`}>{mo.item_name || `Item ${mo.item_id}`} · plan {number(mo.quantity_planned)} · produced {number(mo.quantity_produced)} · {mo.consumptions.length} BOM lines</p></div><div className="flex flex-wrap gap-2">'''
          new_mo = '''<p className={`mt-1 text-xs ${muted}`}>{mo.item_name || `Item ${mo.item_id}`} · plan {number(mo.quantity_planned)} · produced {number(mo.quantity_produced)} · {mo.consumptions.length} BOM lines</p><div className="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-4"><div className={`rounded-lg border px-2.5 py-2 ${isDark ? 'border-slate-700' : 'border-slate-200'}`}><p className={`text-[10px] uppercase ${muted}`}>Yield</p><p className="text-sm font-black">{number(mo.yield_percentage ?? mo.yieldPercentage ?? 0)}%</p></div><div className={`rounded-lg border px-2.5 py-2 ${isDark ? 'border-slate-700' : 'border-slate-200'}`}><p className={`text-[10px] uppercase ${muted}`}>Planned material</p><p className="text-sm font-black">{money(mo.planned_material_cost ?? mo.plannedMaterialCost ?? 0)}</p></div><div className={`rounded-lg border px-2.5 py-2 ${isDark ? 'border-slate-700' : 'border-slate-200'}`}><p className={`text-[10px] uppercase ${muted}`}>Consumed cost</p><p className="text-sm font-black">{money(mo.consumed_material_cost ?? mo.consumedMaterialCost ?? 0)}</p></div><div className={`rounded-lg border px-2.5 py-2 ${isDark ? 'border-slate-700' : 'border-slate-200'}`}><p className={`text-[10px] uppercase ${muted}`}>Output / unit</p><p className="text-sm font-black">{money(mo.output_unit_cost ?? mo.outputUnitCost ?? 0)}</p></div></div></div><div className="flex flex-wrap gap-2">'''
          if old_mo not in text:
              raise SystemExit('manufacturing card anchor not found')
          text = text.replace(old_mo, new_mo, 1)

          old_quality = '''<p className={`mt-1 text-xs ${muted}`}>{qc.item_name || qc.inventory_name || 'General check'} · {qc.reference_type || 'manual'} {qc.reference_id || ''}</p></div>{qc.status === 'pending' &&'''
          new_quality = '''<p className={`mt-1 text-xs ${muted}`}>{qc.item_name || qc.inventory_name || 'General check'} · {qc.reference_type || 'manual'} {qc.reference_id || ''}</p>{qc.check_type === 'production_output' && qc.criteria && <div className={`mt-2 flex flex-wrap gap-x-4 gap-y-1 text-[11px] ${muted}`}><span>Output {number(qc.criteria.quantityProduced)}</span><span>Yield {number(qc.criteria.yieldPercentage)}%</span><span>Material {money(qc.criteria.materialCost)}</span><span>Unit cost {money(qc.criteria.outputUnitCost)}</span></div>}</div>{qc.status === 'pending' &&'''
          if old_quality not in text:
              raise SystemExit('quality card anchor not found')
          text = text.replace(old_quality, new_quality, 1)

          path.write_text(text)
          PY
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Commit production UX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/SupplyChainWorkspacePage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(p1-b): surface manufacturing yield and QC metrics"
          git push origin HEAD:feat/odoo-complete-suite
