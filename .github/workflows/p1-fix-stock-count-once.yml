name: P1 One-shot Stock Count Fix

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p1-fix-stock-count-once.yml'

permissions:
  contents: write

jobs:
  fix-stock-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest P1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Rebase before patch
        run: git pull --rebase origin feat/odoo-complete-suite

      - name: Patch physical variance calculation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/modules/fnb/controllers/warehouse.p1.controller.ts')
          text = path.read_text()

          old = """        const expected = Number(line.expected_quantity || 0);\n        const variance = counted - expected;\n\n        const balanceRows = await tx.$queryRaw<any[]>(Prisma.sql`\n          SELECT * FROM public.warehouse_stock_balances WHERE tenant_id = ${tenantId} AND location_id = ${count.location_id} AND inventory_id = ${inventoryId} FOR UPDATE\n        `);\n        const balanceBefore = Number(balanceRows[0]?.quantity || 0);"""
          new = """        const snapshotExpected = Number(line.expected_quantity || 0);\n\n        const balanceRows = await tx.$queryRaw<any[]>(Prisma.sql`\n          SELECT * FROM public.warehouse_stock_balances WHERE tenant_id = ${tenantId} AND location_id = ${count.location_id} AND inventory_id = ${inventoryId} FOR UPDATE\n        `);\n        const balanceBefore = Number(balanceRows[0]?.quantity || 0);\n        // Physical variance must be measured against the current system balance at finalize time.\n        // Otherwise a legitimate receipt/transfer during an open count would corrupt aggregate stock.\n        const variance = counted - balanceBefore;\n        const movementDuringCount = balanceBefore - snapshotExpected;"""
          if old not in text:
              raise SystemExit('Stock-count variance block did not match expected source')
          text = text.replace(old, new, 1)

          old_note = "notes: `Stock count ${count.count_number}; variance ${variance}`,"
          new_note = "notes: `Stock count ${count.count_number}; physical variance ${variance}; system movement during count ${movementDuringCount}; snapshot expected ${snapshotExpected}; effective expected ${balanceBefore}`,"
          if old_note not in text:
              raise SystemExit('Stock-count movement note marker not found')
          text = text.replace(old_note, new_note, 1)

          old_line = "await tx.$executeRaw(Prisma.sql`UPDATE public.stock_count_lines SET counted_quantity = ${counted}, variance_quantity = ${variance} WHERE id = ${line.id}`);"
          new_line = "await tx.$executeRaw(Prisma.sql`UPDATE public.stock_count_lines SET expected_quantity = ${balanceBefore}, counted_quantity = ${counted}, variance_quantity = ${variance} WHERE id = ${line.id}`);"
          if old_line not in text:
              raise SystemExit('Stock-count final line update marker not found')
          text = text.replace(old_line, new_line, 1)

          path.write_text(text)
          PY

      - name: Add regression contract test
        run: |
          cat > backend/tests/unit/p1-stock-count-concurrency.test.ts <<'EOF'
          import fs from 'fs';
          import path from 'path';

          const controller = fs.readFileSync(
            path.resolve(__dirname, '../../src/modules/fnb/controllers/warehouse.p1.controller.ts'),
            'utf8'
          );

          describe('P1 stock count concurrency contract', () => {
            test('physical variance uses current locked location balance, not stale opening snapshot', () => {
              expect(controller).toContain('const snapshotExpected = Number(line.expected_quantity || 0)');
              expect(controller).toContain('const variance = counted - balanceBefore');
              expect(controller).not.toContain('const variance = counted - expected');
              expect(controller).toContain('system movement during count');
              expect(controller).toContain('SET expected_quantity = ${balanceBefore}, counted_quantity = ${counted}, variance_quantity = ${variance}');
            });
          });
          EOF

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Remove one-shot workflow
        run: rm .github/workflows/p1-fix-stock-count-once.yml

      - name: Rebase latest branch before commit
        run: git pull --rebase --autostash origin feat/odoo-complete-suite

      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/fnb/controllers/warehouse.p1.controller.ts backend/tests/unit/p1-stock-count-concurrency.test.ts .github/workflows/p1-fix-stock-count-once.yml
          git diff --cached --check
          git commit -m "fix(p1): keep stock-count reconciliation correct during movement"
          git push origin HEAD:feat/odoo-complete-suite
