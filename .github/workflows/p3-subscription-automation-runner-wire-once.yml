name: P3 Subscription Automation Runner Wire Once

on:
  push:
    branches: [feat/p3-subscription-automation]
    paths:
      - '.github/workflows/p3-subscription-automation-runner-wire-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-subscription-automation
          fetch-depth: 0
      - name: Register forward migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/src/scripts/apply-p3-migrations.ts')
          text=p.read_text()
          anchor="  '20260813210000_p3_subscription_core',\n"
          if '20260813213000_p3_subscription_automation' not in text:
              if anchor not in text: raise SystemExit('migration runner anchor missing')
              p.write_text(text.replace(anchor, anchor+"  '20260813213000_p3_subscription_automation',\n",1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend build
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Commit runner wiring
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/scripts/apply-p3-migrations.ts
          git commit -m "feat(p3): register subscription automation migration"
          git push origin HEAD:feat/p3-subscription-automation
