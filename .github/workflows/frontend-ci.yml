name: Suite CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend TypeScript gate
        run: npx tsc -b --pretty false

      - name: Frontend dependency audit
        run: npm audit --audit-level=high

      - name: Production build gate
        run: npm run build

  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: suite_user
          POSTGRES_PASSWORD: suite_password
          POSTGRES_DB: posduplicate_suite
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://suite_user:suite_password@localhost:5432/posduplicate_suite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Backend TypeScript build gate
        run: npm run build

      - name: Backend dependency audit
        run: npm audit --audit-level=high

      - name: Build legacy schema baseline
        run: npx prisma db push --skip-generate

      - name: Production P1 migration runner
        run: node dist/scripts/apply-p1-migrations.js

      - name: Verify migration runner idempotency
        run: node dist/scripts/apply-p1-migrations.js

      - name: Verify P1 tables, migration ledger, and immutable triggers
        run: node dist/scripts/verify-p1-database-v2.js

      - name: Production P3 migration runner
        run: node dist/scripts/apply-p3-migrations.js

      - name: Verify P3 migration runner idempotency
        run: node dist/scripts/apply-p3-migrations.js

      - name: Verify P3 database behavior
        run: node dist/scripts/verify-p3-database.js

      - name: Production backend Docker image build gate
        working-directory: .
        run: docker build --file backend/Dockerfile --tag omnipilot-backend:p1-ci backend
