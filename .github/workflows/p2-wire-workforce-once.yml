name: P2 Wire Workforce Once

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p2-wire-workforce-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wire Workforce workspace
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('frontend/src/App.tsx')
          text = app.read_text()
          anchor = "const SupplyChainWorkspacePage = lazy(() => import('./pages/SupplyChainWorkspacePage'));"
          replacement = anchor + "\nconst WorkforceWorkspacePage = lazy(() => import('./pages/WorkforceWorkspacePage'));"
          if 'WorkforceWorkspacePage' not in text:
              if anchor not in text: raise SystemExit('App import anchor not found')
              text = text.replace(anchor, replacement, 1)
          route_anchor = '<Route path="/supply-chain" element={<TenantModuleRoute moduleKey="inventory"><OwnerRoute><SupplyChainWorkspacePage /></OwnerRoute></TenantModuleRoute>} />'
          route_replacement = route_anchor + '\n          <Route path="/workforce" element={<TenantModuleRoute moduleKey="accounting"><ProtectedRoute><WorkforceWorkspacePage /></ProtectedRoute></TenantModuleRoute>} />'
          if 'path="/workforce"' not in text:
              if route_anchor not in text: raise SystemExit('App route anchor not found')
              text = text.replace(route_anchor, route_replacement, 1)
          app.write_text(text)

          catalog = Path('frontend/src/config/suiteCatalog.ts')
          text = catalog.read_text()
          old_employees = "{ id: 'employees', category: 'human-resources', name: 'Employees', description: 'Employee master data, organization, documents, status, and employment profile.', icon: Users, bundle: 'accounting', status: 'partial', capabilities: ['Employee Master', 'Organization', 'Documents', 'Employment Data'] }"
          new_employees = "{ id: 'employees', category: 'human-resources', name: 'Employees', description: 'Employee master data, organization, documents, status, and employment profile.', icon: Users, bundle: 'accounting', status: 'live', path: '/workforce', capabilities: ['Employee Master', 'Organization', 'Documents', 'Employment Data'] }"
          old_attendance = "{ id: 'attendances', category: 'human-resources', name: 'Attendances', description: 'Clock in/out, attendance logs, lateness, overtime input, and shift records.', icon: Clock3, bundle: 'accounting', status: 'partial', capabilities: ['Clock In/Out', 'Attendance', 'Overtime', 'Shift'] }"
          new_attendance = "{ id: 'attendances', category: 'human-resources', name: 'Attendances', description: 'Clock in/out, attendance logs, lateness, overtime input, and shift records.', icon: Clock3, bundle: 'accounting', status: 'live', path: '/workforce', capabilities: ['Clock In/Out', 'Attendance', 'Overtime', 'Shift'] }"
          if old_employees in text: text = text.replace(old_employees, new_employees, 1)
          elif new_employees not in text: raise SystemExit('Employees catalog anchor not found')
          if old_attendance in text: text = text.replace(old_attendance, new_attendance, 1)
          elif new_attendance not in text: raise SystemExit('Attendance catalog anchor not found')
          catalog.write_text(text)
          PY
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/config/suiteCatalog.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(p2): wire workforce workspace"
          git push origin HEAD:feat/odoo-complete-suite
