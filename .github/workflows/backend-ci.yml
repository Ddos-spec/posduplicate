name: Backend CI (Inventory & POS)

on:
  push:
    branches: [ "main", "master", "feat/**", "fix/**" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: backend_ci
          POSTGRES_PASSWORD: backend_ci
          POSTGRES_DB: posduplicate_backend_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://backend_ci:backend_ci@localhost:5432/posduplicate_backend_ci

    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Build backend
      run: npm run build

    - name: Build test database baseline
      run: npx prisma db push --skip-generate

    - name: Run Tests (Unit & Integration)
      run: npm test -- --runInBand
