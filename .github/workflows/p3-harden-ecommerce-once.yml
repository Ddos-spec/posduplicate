name: P3 Harden Ecommerce Once
on:
  push:
    branches: [feat/odoo-complete-suite]
    paths: ['.github/workflows/p3-harden-ecommerce-once.yml']
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0
      - name: Clean generated artifacts and harden ecommerce lifecycle
        run: |
          rm -rf graphify-out
          python3 <<'PY'
          from pathlib import Path

          gitignore = Path('.gitignore')
          text = gitignore.read_text()
          if 'graphify-out/' not in text:
            text = text.rstrip() + '\n\n# Generated code-graph analysis\ngraphify-out/\n'
            gitignore.write_text(text)

          transition = Path('backend/src/modules/fnb/services/ecommerce-transition.p3.service.ts')
          text = transition.read_text()
          old = "  if (!(TRANSITIONS[order.status] || []).includes(target)) throw Object.assign(new Error('Invalid order transition'), { status: 409, code: 'INVALID_ECOMMERCE_ORDER_TRANSITION' });\n\n  if (target === 'cancelled') {\n    if (order.status === 'cancelled') return order; // idempotent: already cancelled\n"
          new = "  if (order.status === 'cancelled' && target === 'cancelled') return order;\n  if (!(TRANSITIONS[order.status] || []).includes(target)) throw Object.assign(new Error('Invalid order transition'), { status: 409, code: 'INVALID_ECOMMERCE_ORDER_TRANSITION' });\n\n  if (target === 'cancelled') {\n"
          if old not in text:
            raise SystemExit('transition marker missing')
          transition.write_text(text.replace(old, new, 1))

          controller = Path('backend/src/modules/fnb/controllers/ecommerce-create.p3.controller.ts')
          text = controller.read_text()
          text = text.replace("import { reserveGuestOrder } from '../services/ecommerce-reservation.p3.service';", "import { reserveGuestOrderV2 } from '../services/ecommerce-reservation-v2.p3.service';")
          text = text.replace('const data = await reserveGuestOrder({', 'const data = await reserveGuestOrderV2({')
          controller.write_text(text)

          legacy = Path('backend/src/modules/fnb/services/ecommerce-reservation.p3.service.ts')
          legacy.write_text("// Compatibility alias. The V2 implementation is the single canonical reservation path.\nexport { reserveGuestOrderV2 as reserveGuestOrder } from './ecommerce-reservation-v2.p3.service';\nexport type { GuestReservationInput as GuestOrderInput } from './ecommerce-reservation-v2.p3.service';\n")

          lock = Path('backend/src/modules/fnb/services/ecommerce-catalog-lock.p3.service.ts')
          text = lock.read_text()
          old = "      AND c.is_published=TRUE AND i.outlet_id=${site.fulfillment_outlet_id}\n"
          new = "      AND c.is_published=TRUE AND COALESCE(i.is_active,TRUE)=TRUE AND i.outlet_id=${site.fulfillment_outlet_id}\n"
          if old not in text:
            raise SystemExit('catalog lock marker missing')
          lock.write_text(text.replace(old, new, 1))

          contract = Path('backend/tests/unit/p3-website-commerce-contract.test.ts')
          text = contract.read_text()
          text = text.replace("    expect(reservationService).toContain('const reservedQty = item.track_stock ? item.quantity : 0');\n    expect(reservationService).toContain('reserved_stock_quantity)');", "    expect(reservationV2Service).toContain('const reservedStock = item.track_stock ? requested.quantity : 0');\n    expect(orderWriteService).toContain('reserved_stock_quantity)');")
          text = text.replace("    expect(transitionService).toContain(\"if (order.status === 'cancelled') return order\");", "    expect(transitionService).toContain(\"if (order.status === 'cancelled' && target === 'cancelled') return order\");")
          if "COALESCE(i.is_active,TRUE)=TRUE" not in text:
            text = text.replace("    expect(controller).toContain('AND i.outlet_id=s.fulfillment_outlet_id');\n  });", "    expect(controller).toContain('AND i.outlet_id=s.fulfillment_outlet_id');\n    expect(catalogLockService).toContain('COALESCE(i.is_active,TRUE)=TRUE');\n  });")
          contract.write_text(text)

          behavior = Path('backend/tests/unit/p3-ecommerce-transition-behavior.test.ts')
          behavior.write_text("""import { transitionOrder } from '../../src/modules/fnb/services/ecommerce-transition.p3.service';
import prisma from '../../src/utils/prisma';

jest.mock('../../src/utils/prisma', () => ({
  __esModule: true,
  default: { $transaction: jest.fn() },
}));

const db = prisma as any;

describe('P3.2 ecommerce transition behavior', () => {
  beforeEach(() => jest.clearAllMocks());

  test('repeating cancelled -> cancelled is a no-op without double restock or duplicate event', async () => {
    const cancelled = { id: 41, tenant_id: 7, outlet_id: 3, status: 'cancelled' };
    const tx = {
      $queryRaw: jest.fn().mockResolvedValueOnce([cancelled]),
      $executeRaw: jest.fn(),
    };
    db.$transaction.mockImplementation(async (callback: any) => callback(tx));

    await expect(transitionOrder(7, 99, 41, 'cancelled')).resolves.toEqual(cancelled);
    expect(tx.$queryRaw).toHaveBeenCalledTimes(1);
    expect(tx.$executeRaw).not.toHaveBeenCalled();
  });

  test('completed -> cancelled is rejected before any stock mutation', async () => {
    const tx = {
      $queryRaw: jest.fn().mockResolvedValueOnce([{ id: 42, tenant_id: 7, outlet_id: 3, status: 'completed' }]),
      $executeRaw: jest.fn(),
    };
    db.$transaction.mockImplementation(async (callback: any) => callback(tx));

    await expect(transitionOrder(7, 99, 42, 'cancelled')).rejects.toMatchObject({ code: 'INVALID_ECOMMERCE_ORDER_TRANSITION' });
    expect(tx.$queryRaw).toHaveBeenCalledTimes(1);
    expect(tx.$executeRaw).not.toHaveBeenCalled();
  });
});
""")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend install and Prisma client
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
      - name: P3 ecommerce regression tests
        working-directory: backend
        run: npx jest tests/unit/p3-ecommerce-transition-behavior.test.ts tests/unit/p3-website-commerce-contract.test.ts --runInBand
      - name: Backend TypeScript build
        working-directory: backend
        run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build:check
      - name: Commit hardened tranche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git ls-files 'graphify-out/**' | grep -q .; then
            echo 'graphify-out remains tracked' >&2
            exit 1
          fi
          git diff --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(p3): harden ecommerce reservation and cancellation"
          git push origin HEAD:feat/odoo-complete-suite
