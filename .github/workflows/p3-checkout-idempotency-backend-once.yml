name: P3 Checkout Idempotency Backend Once

on:
  push:
    branches: [feat/odoo-complete-suite]
    paths:
      - '.github/workflows/p3-checkout-idempotency-backend-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Patch backend checkout idempotency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing: {path}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'backend/src/modules/fnb/services/ecommerce-order.p3.service.ts',
              "export const newOrderNumber = () => `WEB-${Date.now()}-${crypto.randomBytes(3).toString('hex').toUpperCase()}`;\n\nexport const normalizeOrderItems",
              "export const newOrderNumber = () => `WEB-${Date.now()}-${crypto.randomBytes(3).toString('hex').toUpperCase()}`;\n\nexport const normalizeCheckoutToken = (value: unknown) => {\n  const token = String(value ?? '').trim();\n  if (!/^[A-Za-z0-9_-]{32,128}$/.test(token)) throw Object.assign(new Error('Invalid checkout token'), { status: 400, code: 'INVALID_CHECKOUT_TOKEN' });\n  return token;\n};\n\nexport const normalizeOrderItems",
          )

          replace(
              'backend/src/modules/fnb/controllers/ecommerce-create.p3.controller.ts',
              "import { cleanOrderText, normalizeOrderItems } from '../services/ecommerce-order.p3.service';",
              "import { cleanOrderText, normalizeCheckoutToken, normalizeOrderItems } from '../services/ecommerce-order.p3.service';",
          )
          replace(
              'backend/src/modules/fnb/controllers/ecommerce-create.p3.controller.ts',
              "    const customerPhone = cleanOrderText(req.body.customerPhone, 40);\n",
              "    const customerPhone = cleanOrderText(req.body.customerPhone, 40);\n    const token = normalizeCheckoutToken(req.header('x-order-token'));\n",
          )
          replace(
              'backend/src/modules/fnb/controllers/ecommerce-create.p3.controller.ts',
              "      publicSlug,\n      customerName,",
              "      publicSlug,\n      token,\n      customerName,",
          )
          replace(
              'backend/src/modules/fnb/controllers/ecommerce-create.p3.controller.ts',
              "    return res.status(201).json({ success: true, data });",
              "    return res.status(data.reused ? 200 : 201).json({ success: true, data });",
          )

          replace(
              'backend/src/modules/fnb/services/ecommerce-order-write.p3.service.ts',
              "import { Prisma } from '@prisma/client';\n\n",
              "import { Prisma } from '@prisma/client';\n\nexport const findGuestOrderByTokenHash = async (tx: Prisma.TransactionClient, tokenHash: string) => {\n  const rows = await tx.$queryRaw<any[]>(Prisma.sql`SELECT id,tenant_id,site_id,order_number,status,total FROM public.ecommerce_orders WHERE public_token_hash=${tokenHash} LIMIT 1`);\n  return rows[0] ?? null;\n};\n\n",
          )
          replace(
              'backend/src/modules/fnb/services/ecommerce-order-write.p3.service.ts',
              '    RETURNING id,status,total',
              '    RETURNING id,order_number,status,total',
          )

          replace(
              'backend/src/modules/fnb/services/ecommerce-reservation-v2.p3.service.ts',
              "import { hashOrderToken, newOrderNumber, newOrderToken, RequestedOrderItem } from './ecommerce-order.p3.service';",
              "import { hashOrderToken, newOrderNumber, RequestedOrderItem } from './ecommerce-order.p3.service';",
          )
          replace(
              'backend/src/modules/fnb/services/ecommerce-reservation-v2.p3.service.ts',
              "import { appendOrderEvent, decrementReservedStock, insertGuestOrder, insertReservedOrderLine } from './ecommerce-order-write.p3.service';",
              "import { appendOrderEvent, decrementReservedStock, findGuestOrderByTokenHash, insertGuestOrder, insertReservedOrderLine } from './ecommerce-order-write.p3.service';",
          )
          replace(
              'backend/src/modules/fnb/services/ecommerce-reservation-v2.p3.service.ts',
              '  publicSlug: string; customerName: string; customerPhone: string; customerEmail: string | null;',
              '  publicSlug: string; token: string; customerName: string; customerPhone: string; customerEmail: string | null;',
          )
          replace(
              'backend/src/modules/fnb/services/ecommerce-reservation-v2.p3.service.ts',
              "  const token = newOrderToken();\n  const orderNumber = newOrderNumber();\n  const tokenHash = hashOrderToken(token);\n\n  const order = await prisma.$transaction(async (tx) => {\n    const site = await lockPublishedStorefront(tx, input.publicSlug);\n    const lines:",
              "  const token = input.token;\n  const tokenHash = hashOrderToken(token);\n\n  const result = await prisma.$transaction(async (tx) => {\n    const site = await lockPublishedStorefront(tx, input.publicSlug);\n    const existing = await findGuestOrderByTokenHash(tx, tokenHash);\n    if (existing) {\n      if (Number(existing.tenant_id) !== Number(site.tenant_id) || Number(existing.site_id) !== Number(site.id)) throw Object.assign(new Error('Checkout token was already used for another storefront'), { status: 409, code: 'CHECKOUT_TOKEN_REUSED' });\n      return { row: existing, reused: true };\n    }\n    const orderNumber = newOrderNumber();\n    const lines:",
          )
          replace(
              'backend/src/modules/fnb/services/ecommerce-reservation-v2.p3.service.ts',
              "    return row;\n  });\n\n  return { orderNumber, token, status: order.status, total: order.total };",
              "    return { row, reused: false };\n  });\n\n  return { orderNumber: String(result.row.order_number), token, status: result.row.status, total: result.row.total, reused: result.reused };",
          )
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend build
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Commit backend hardening
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/modules/fnb/services/ecommerce-order.p3.service.ts backend/src/modules/fnb/controllers/ecommerce-create.p3.controller.ts backend/src/modules/fnb/services/ecommerce-order-write.p3.service.ts backend/src/modules/fnb/services/ecommerce-reservation-v2.p3.service.ts
          git commit -m "fix(p3): make checkout reservation retry-safe"
          git push origin HEAD:feat/odoo-complete-suite
