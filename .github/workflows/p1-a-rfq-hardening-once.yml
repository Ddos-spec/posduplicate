name: P1-A RFQ Hardening Gate

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p1-a-rfq-hardening-once.yml'

permissions:
  contents: write

jobs:
  harden-rfq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Apply deterministic RFQ patch
        run: python .github/scripts/p1_a_rfq_hardening.py

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Backend TypeScript build
        working-directory: backend
        run: npm run build

      - name: Run RFQ path tests
        working-directory: backend
        run: npm test -- --runInBand p1-rfq-paths.test.ts p1-rfq-capability.api.test.ts

      - name: Run full backend test suite
        working-directory: backend
        run: npm test -- --runInBand

      - name: Verify intended diff
        run: git diff --check

      - name: Remove one-shot helper files
        run: rm .github/workflows/p1-a-rfq-hardening-once.yml .github/scripts/p1_a_rfq_hardening.py

      - name: Commit tested RFQ hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/fnb/controllers/procurement-rfq.p1.controller.ts backend/tests/unit/p1-rfq-paths.test.ts backend/tests/integration/p1-rfq-capability.api.test.ts .github/workflows/p1-a-rfq-hardening-once.yml .github/scripts/p1_a_rfq_hardening.py
          git diff --cached --check
          git commit -m "test(p1-a): harden RFQ paths and authorization"
          git push origin HEAD:feat/odoo-complete-suite
