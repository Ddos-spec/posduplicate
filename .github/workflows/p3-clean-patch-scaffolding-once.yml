name: P3 Clean Patch Scaffolding Once

on:
  push:
    branches: [feat/p3-subscription-auto-renew]
    paths:
      - '.github/workflows/p3-clean-patch-scaffolding-once.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-subscription-auto-renew
          fetch-depth: 0
      - name: Remove temporary workflows
        shell: bash
        run: |
          git rm -f .github/workflows/p3-subscription-stale-retry-test-once.yml .github/workflows/p3-clean-patch-scaffolding-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(p3): remove temporary hardening workflows"
          git push origin HEAD:feat/p3-subscription-auto-renew
