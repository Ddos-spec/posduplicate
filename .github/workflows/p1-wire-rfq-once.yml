name: P1 One-shot RFQ V2 Wiring

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p1-wire-rfq-once.yml'

permissions:
  contents: write

jobs:
  wire-rfq-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Wire RFQ V2 into Procurement workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path('frontend/src/components/supply-chain/ProcurementRfqPanelV2.tsx')
          panel = panel_path.read_text()

          old_signature = "export default function ProcurementRfqPanelV2() {"
          new_signature = "type ProcurementRfqPanelV2Props = {\n  onPoConverted?: () => void | Promise<void>;\n};\n\nexport default function ProcurementRfqPanelV2({ onPoConverted }: ProcurementRfqPanelV2Props) {"
          if old_signature in panel:
              panel = panel.replace(old_signature, new_signature, 1)
          elif new_signature not in panel:
              raise SystemExit('RFQ V2 component signature marker not found')

          old_convert = "      const po = await convertPurchaseRfqToPo(rfq.id);\n      await load();\n      toast.success(`${po.po_number} dibuat`);"
          new_convert = "      const po = await convertPurchaseRfqToPo(rfq.id);\n      await load();\n      await onPoConverted?.();\n      toast.success(`${po.po_number} dibuat dan masuk ke Purchase Order Control`);"
          if old_convert in panel:
              panel = panel.replace(old_convert, new_convert, 1)
          elif new_convert not in panel:
              raise SystemExit('RFQ V2 convert marker not found')

          panel_path.write_text(panel)

          page_path = Path('frontend/src/pages/SupplyChainWorkspacePage.tsx')
          page = page_path.read_text()

          import_line = "import ProcurementRfqPanelV2 from '../components/supply-chain/ProcurementRfqPanelV2';"
          if import_line not in page:
              anchor = "} from '../services/supplyChainService';"
              if anchor not in page:
                  raise SystemExit('Supply-chain service import anchor not found')
              page = page.replace(anchor, anchor + "\n" + import_line, 1)

          procurement_start = "{tab === 'procurement' && <section className={`rounded-2xl border ${card}`}"
          warehouse_start = "{tab === 'warehouse' &&"
          p_start = page.find(procurement_start)
          w_start = page.find(warehouse_start)
          if p_start < 0 or w_start < 0 or w_start <= p_start:
              already = '<ProcurementRfqPanelV2 onPoConverted={load} />' in page
              if not already:
                  raise SystemExit('Procurement/Warehouse tab boundaries not found')
          else:
              segment = page[p_start:w_start]
              if '<ProcurementRfqPanelV2 onPoConverted={load} />' not in segment:
                  segment = segment.replace(
                      "{tab === 'procurement' && <section",
                      "{tab === 'procurement' && <div className=\"space-y-5\"><ProcurementRfqPanelV2 onPoConverted={load} /><section",
                      1,
                  )
                  stripped = segment.rstrip()
                  if not stripped.endswith('</section>}'):
                      raise SystemExit('Procurement section closing marker not found')
                  stripped = stripped[:-len('</section>}')] + '</section></div>}'
                  segment = stripped + segment[len(segment.rstrip()):]
                  page = page[:p_start] + segment + page[w_start:]

          if page.count('<ProcurementRfqPanelV2 onPoConverted={load} />') != 1:
              raise SystemExit(f'Expected one RFQ V2 panel, found {page.count("<ProcurementRfqPanelV2 onPoConverted={load} />")}')
          if page.count(import_line) != 1:
              raise SystemExit(f'Expected one RFQ V2 import, found {page.count(import_line)}')

          page_path.write_text(page)
          PY

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Production frontend build gate
        working-directory: frontend
        run: npm run build

      - name: Verify only intended RFQ wiring changed
        run: |
          git diff --check
          git diff -- frontend/src/components/supply-chain/ProcurementRfqPanelV2.tsx frontend/src/pages/SupplyChainWorkspacePage.tsx

      - name: Remove one-shot workflow
        run: rm .github/workflows/p1-wire-rfq-once.yml

      - name: Commit only after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/supply-chain/ProcurementRfqPanelV2.tsx frontend/src/pages/SupplyChainWorkspacePage.tsx .github/workflows/p1-wire-rfq-once.yml
          git diff --cached --check
          git commit -m "feat(p1-a): wire RFQ V2 into procurement workspace"
          git push origin HEAD:feat/odoo-complete-suite
