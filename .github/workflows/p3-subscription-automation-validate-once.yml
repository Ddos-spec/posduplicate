name: P3 Subscription Automation Validate Once

on:
  push:
    branches: [feat/p3-subscription-automation]
    paths:
      - '.github/workflows/p3-subscription-automation-validate-once.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-subscription-automation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend subscription tests and build
        working-directory: backend
        run: |
          npm ci
          npm test -- --runInBand tests/unit/p3-subscription-core-contract.test.ts tests/unit/p3-subscription-renewal-retry.test.ts tests/unit/p3-subscription-calendar.test.ts tests/unit/p3-subscription-automation-contract.test.ts
          npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build:check
