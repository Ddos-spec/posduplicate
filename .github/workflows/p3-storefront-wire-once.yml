name: P3 Storefront Wire Once
on:
  push:
    branches: [feat/odoo-complete-suite]
    paths: ['.github/workflows/p3-storefront-wire-once.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0
      - name: Wire storefront runtime
        run: |
          rm -f .github/workflows/p3-harden-ecommerce-once.yml .github/workflows/p3-storefront-runtime-once.yml
          python3 <<'PY'
          from pathlib import Path
          import base64

          types_b64 = ''
          funcs_b64 = ''
          contract_b64 = ''

          service = Path('frontend/src/services/digitalWebsiteService.ts')
          text = service.read_text()
          if 'export type EcommerceOrderStatus' not in text:
              marker = 'const unwrap = <T>(response: { data: { data: T } }): T => response.data.data;'
              if marker not in text: raise SystemExit('service marker missing')
              text = text.replace(marker, base64.b64decode(types_b64).decode() + marker, 1)
          if 'createPublicStorefrontOrder' not in text:
              text = text.rstrip() + base64.b64decode(funcs_b64).decode()
          service.write_text(text)

          app = Path('frontend/src/App.tsx')
          text = app.read_text()
          lazy = "const DigitalWebsiteWorkspacePage = lazy(() => import('./pages/DigitalWebsiteWorkspacePage'));"
          if 'const StorefrontPage' not in text:
              text = text.replace(lazy, lazy + "\nconst StorefrontPage = lazy(() => import('./pages/StorefrontPage'));", 1)
          route = '          <Route path="/module-selector" element={<ProtectedRoute><ModuleSelectorPage /></ProtectedRoute>} />'
          if '<Route path="/store/:publicSlug"' not in text:
              text = text.replace(route, '          <Route path="/store/:publicSlug" element={<StorefrontPage />} />\n' + route, 1)
          app.write_text(text)

          workspace = Path('frontend/src/pages/DigitalWebsiteWorkspacePage.tsx')
          text = workspace.read_text()
          if 'EcommerceOrderManager' not in text:
              text = text.replace("import CatalogManager from './digital/CatalogManager';", "import CatalogManager from './digital/CatalogManager';\nimport EcommerceOrderManager from './digital/EcommerceOrderManager';", 1)
              marker = '      {siteId && <div className="mt-5 grid gap-5 lg:grid-cols-2"><PageManager siteId={siteId} /><CatalogManager siteId={siteId} /></div>}\n'
              if marker not in text: raise SystemExit('workspace marker missing')
              text = text.replace(marker, marker + '      <div className="mt-5"><EcommerceOrderManager /></div>\n', 1)
          workspace.write_text(text)

          server = Path('backend/src/server.ts')
          text = server.read_text()
          if "'X-Order-Token'" not in text:
              text = text.replace("    'If-Modified-Since'\n", "    'If-Modified-Since',\n    'X-Order-Token'\n", 1)
          server.write_text(text)

          api = Path('frontend/src/services/api.ts')
          text = api.read_text()
          old = "    if (error.response?.status === 401) {\n      useAuthStore.getState().logout();\n      window.location.href = '/login';\n    }"
          new = "    if (error.response?.status === 401 && error.config?.headers?.Authorization) {\n      useAuthStore.getState().logout();\n      window.location.href = '/login';\n    }"
          if old in text: text = text.replace(old, new, 1)
          api.write_text(text)

          Path('backend/tests/unit/p3-ecommerce-frontend-contract.test.ts').write_bytes(base64.b64decode(contract_b64))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend install
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
      - name: P3 contract tests
        working-directory: backend
        run: npx jest tests/unit/p3-ecommerce-transition-behavior.test.ts tests/unit/p3-website-commerce-contract.test.ts tests/unit/p3-ecommerce-frontend-contract.test.ts --runInBand
      - name: Backend build
        working-directory: backend
        run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build:check
      - name: Commit storefront wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(p3): wire storefront checkout and order operations"
          git push origin HEAD:feat/odoo-complete-suite
