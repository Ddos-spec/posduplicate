name: P3 Subscription Capability Replay Once

on:
  push:
    branches: [feat/odoo-complete-suite]
    paths:
      - '.github/workflows/p3-subscription-capability-replay-once.yml'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0
      - name: Patch capability map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/src/middlewares/capability.middleware.ts')
          text=p.read_text()
          if "'revenue.subscription.read'" not in text:
              text=text.replace("  | 'revenue.sales.manage'\n  | 'revenue.customer360.read'", "  | 'revenue.sales.manage'\n  | 'revenue.subscription.read'\n  | 'revenue.subscription.manage'\n  | 'revenue.customer360.read'", 1)
              text=text.replace("    'revenue.sales.read',\n    'revenue.customer360.read',", "    'revenue.sales.read',\n    'revenue.subscription.read',\n    'revenue.customer360.read',", 1)
              p.write_text(text)
          PY
      - name: Commit and rebase before push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/middlewares/capability.middleware.ts
          git diff --cached --quiet || git commit -m "feat(p3): add subscription capabilities"
          git pull --rebase origin feat/odoo-complete-suite
          git push origin HEAD:feat/odoo-complete-suite
