name: P3 Subscription Stale Retry Test Once

on:
  push:
    branches: [feat/p3-subscription-auto-renew]
    paths:
      - '.github/workflows/p3-subscription-stale-retry-test-once.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-subscription-auto-renew
      - name: Add stale retry regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/tests/unit/p3-subscription-renewal-retry.test.ts')
          text=p.read_text()
          marker='\n});\n'
          case="""

  test('reuses prior expected period after next_renewal advanced without billing the next period', async () => {
    const renewal = { id: 21, tenant_id: 4, subscription_id: 9, period_start: '2026-08-01', period_end: '2026-09-01', status: 'materialized', sales_order_id: 31, receivable_id: 41, amount: '150000.00' };
    queryRaw
      .mockResolvedValueOnce([{ id: 9, tenant_id: 4, outlet_id: 2, customer_id: 7, customer_name: 'Customer A', subscription_number: 'SUB-2026-000009', status: 'active', interval_unit: 'month', interval_count: 1, currency: 'IDR', next_renewal_at: '2026-09-01' }])
      .mockResolvedValueOnce([renewal]);
    await expect(materializeSubscriptionRenewal(4, 3, 9, '2026-08-01')).resolves.toEqual({ renewal, reused: true });
    expect(queryRaw).toHaveBeenCalledTimes(2);
    expect(executeRaw).not.toHaveBeenCalled();
  });
          """
          if "prior expected period" not in text:
              if marker not in text: raise SystemExit('test anchor missing')
              p.write_text(text.replace(marker,case+marker,1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Focused tests
        working-directory: backend
        run: |
          npm ci
          npm test -- --runInBand tests/unit/p3-subscription-renewal-retry.test.ts tests/unit/p3-subscription-calendar.test.ts
      - name: Commit test
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/tests/unit/p3-subscription-renewal-retry.test.ts
          git commit -m "test(p3): cover stale subscription renewal retry"
          git push origin HEAD:feat/p3-subscription-auto-renew
