name: P3 Subscription Capability Build Once

on:
  push:
    branches: [feat/odoo-complete-suite]
    paths:
      - '.github/workflows/p3-subscription-capability-build-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0
      - name: Add subscription capabilities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/middlewares/capability.middleware.ts')
          text = p.read_text()
          old = "  | 'revenue.sales.manage'\n  | 'revenue.customer360.read'"
          new = "  | 'revenue.sales.manage'\n  | 'revenue.subscription.read'\n  | 'revenue.subscription.manage'\n  | 'revenue.customer360.read'"
          if old not in text:
              raise SystemExit('capability union anchor missing')
          text = text.replace(old, new, 1)
          old = "    'revenue.sales.read',\n    'revenue.customer360.read',"
          new = "    'revenue.sales.read',\n    'revenue.subscription.read',\n    'revenue.customer360.read',"
          if old not in text:
              raise SystemExit('accountant preset anchor missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend build
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Commit capability wiring
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/middlewares/capability.middleware.ts
          git commit -m "feat(p3): add subscription capabilities"
          git push origin HEAD:feat/odoo-complete-suite
