name: P1 Runtime Gate

on:
  push:
    branches:
      - 'feat/odoo-complete-suite'
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/p1-runtime-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/p1-runtime-ci.yml'

permissions:
  contents: write

jobs:
  p1-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: p1_user
          POSTGRES_PASSWORD: p1_password
          POSTGRES_DB: p1_runtime
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://p1_user:p1_password@localhost:5432/p1_runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply warehouse integrity patch
        run: python .github/scripts/apply_p1a_warehouse_integrity.py

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Build legacy database baseline
        working-directory: backend
        run: npx prisma db push --skip-generate

      - name: Apply P1 forward migrations
        working-directory: backend
        run: node dist/scripts/apply-p1-migrations.js

      - name: Prove migration idempotency
        working-directory: backend
        run: node dist/scripts/apply-p1-migrations.js

      - name: Warehouse integrity tests
        working-directory: backend
        run: npm test -- --runInBand p1-warehouse-integrity.test.ts

      - name: Backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Verify P1 database behavior
        working-directory: backend
        run: node dist/scripts/verify-p1-database-v2.js

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Backend production Docker build
        run: docker build --file backend/Dockerfile --tag omnipilot-p1-runtime:ci backend

      - name: Commit tested warehouse integrity
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/apply_p1a_warehouse_integrity.py
          git add backend/src/modules/fnb/controllers/warehouse.p1.controller.ts backend/tests/unit/p1-warehouse-integrity.test.ts .github/scripts/apply_p1a_warehouse_integrity.py
          git diff --cached --check
          git commit -m "test(p1-a): harden warehouse transfer and cycle count"
          git push origin HEAD:feat/odoo-complete-suite
