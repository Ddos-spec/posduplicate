name: P1-A Receiving Integrity Gate

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p1-a-receiving-once.yml'
      - 'scripts/p1_a_receiving_hardening.py'

permissions:
  contents: write

jobs:
  receiving-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Apply receiving hardening patch
        run: python scripts/p1_a_receiving_hardening.py

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Backend TypeScript build
        working-directory: backend
        run: npm run build

      - name: Run receiving integrity tests
        working-directory: backend
        run: npm test -- --runInBand p1-receiving-integrity.test.ts

      - name: Run full backend test suite
        working-directory: backend
        run: npm test -- --runInBand

      - name: Verify intended diff
        run: |
          git diff --check
          git diff -- backend/src/modules/fnb/controllers/procurement-receiving.p1.controller.ts backend/tests/unit/p1-receiving-integrity.test.ts

      - name: Remove one-shot helper files
        run: rm scripts/p1_a_receiving_hardening.py .github/workflows/p1-a-receiving-once.yml

      - name: Commit tested receiving hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/fnb/controllers/procurement-receiving.p1.controller.ts backend/tests/unit/p1-receiving-integrity.test.ts scripts/p1_a_receiving_hardening.py .github/workflows/p1-a-receiving-once.yml
          git diff --cached --check
          git commit -m "test(p1-a): harden PO receiving and warehouse integrity"
          git push origin HEAD:feat/odoo-complete-suite
