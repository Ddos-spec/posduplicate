name: P1 One-shot Stock Count Scope Guard

on:
  push:
    branches:
      - feat/odoo-complete-suite
    paths:
      - '.github/workflows/p1-fix-count-scope-once.yml'

permissions:
  contents: write

jobs:
  guard-count-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest P1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/odoo-complete-suite
          fetch-depth: 0

      - name: Rebase latest branch
        run: git pull --rebase origin feat/odoo-complete-suite

      - name: Add stock-count scope drift guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/modules/fnb/controllers/warehouse.p1.controller.ts')
          text = path.read_text()
          marker = """      const lines = await tx.$queryRaw<any[]>(Prisma.sql`SELECT * FROM public.stock_count_lines WHERE stock_count_id = ${stockCountId} ORDER BY id`);"""
          guard = """
      const activeBalances = await tx.$queryRaw<Array<{ inventory_id: number }>>(Prisma.sql`
        SELECT inventory_id
        FROM public.warehouse_stock_balances
        WHERE tenant_id = ${tenantId}
          AND location_id = ${count.location_id}
          AND quantity <> 0
      `);
      const countedScope = new Set(lines.map((line: any) => Number(line.inventory_id)));
      const newInventoryIds = activeBalances
        .map((row) => Number(row.inventory_id))
        .filter((inventoryId) => !countedScope.has(inventoryId));
      if (newInventoryIds.length > 0) {
        throw Object.assign(new Error('Stock count scope berubah karena ada inventory baru masuk ke lokasi. Restart count agar semua inventory ikut dihitung.'), {
          status: 409,
          code: 'COUNT_SCOPE_CHANGED',
          inventoryIds: newInventoryIds,
        });
      }
"""
          if "code: 'COUNT_SCOPE_CHANGED'" not in text:
              if marker not in text:
                  raise SystemExit('Stock-count line marker not found')
              text = text.replace(marker, marker + guard, 1)
          if "code: 'COUNT_SCOPE_CHANGED'" not in text or 'const newInventoryIds = activeBalances' not in text:
              raise SystemExit('Stock-count scope guard verification failed')
          path.write_text(text)
          PY

      - name: Add regression contract
        run: |
          cat > backend/tests/unit/p1-stock-count-scope.test.ts <<'EOF'
          import fs from 'fs';
          import path from 'path';
          const controller = fs.readFileSync(path.resolve(__dirname, '../../src/modules/fnb/controllers/warehouse.p1.controller.ts'), 'utf8');
          describe('P1 stock count scope drift', () => {
            test('finalize rejects inventory that entered after count scope was opened', () => {
              expect(controller).toContain("code: 'COUNT_SCOPE_CHANGED'");
              expect(controller).toContain('const newInventoryIds = activeBalances');
              expect(controller).toContain('quantity <> 0');
            });
          });
          EOF

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Remove one-shot workflow
        run: rm .github/workflows/p1-fix-count-scope-once.yml

      - name: Rebase concurrent safe commits
        run: git pull --rebase --autostash origin feat/odoo-complete-suite

      - name: Re-run backend build after rebase
        working-directory: backend
        run: |
          npm run build
          npm test -- --runInBand

      - name: Commit tested guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/fnb/controllers/warehouse.p1.controller.ts backend/tests/unit/p1-stock-count-scope.test.ts .github/workflows/p1-fix-count-scope-once.yml
          git diff --cached --check
          git commit -m "fix(p1): reject stock-count scope drift during finalize"
          git push origin HEAD:feat/odoo-complete-suite
